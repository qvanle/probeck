<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 9 5 0 9Z" fill="#9d98c4"/></marker></defs>
  <text x="40" y="52" fill="#e8e6f5" font-size="20" font-weight="700">A reorderable list of inputs</text>
  <text x="40" y="78" fill="#9d98c4" font-size="14">The user types in each row, then deletes the first one.</text>
  <text x="90" y="124" fill="#9d98c4" font-size="13" font-weight="700" letter-spacing="1.5">BEFORE</text>
  <text x="400" y="124" fill="#9d98c4" font-size="13" font-weight="700" letter-spacing="1.5">AFTER</text>
  <g font-size="15" font-weight="700">
    <g><rect x="40" y="140" width="220" height="48" rx="12" fill="#2b2257" stroke="#5fe3f0" stroke-width="2"/><text x="62" y="170" fill="#e8e6f5">Alice</text><rect x="140" y="152" width="100" height="24" rx="6" fill="#171233"/><text x="150" y="169" fill="#9d98c4" font-size="12" font-weight="400">draft…</text></g>
    <g><rect x="40" y="204" width="220" height="48" rx="12" fill="#2b2257" stroke="#c084fc" stroke-width="2"/><text x="62" y="234" fill="#e8e6f5">Bob</text><rect x="140" y="216" width="100" height="24" rx="6" fill="#171233"/><text x="150" y="233" fill="#9d98c4" font-size="12" font-weight="400">draft…</text></g>
    <g><rect x="40" y="268" width="220" height="48" rx="12" fill="#2b2257" stroke="#fbbf24" stroke-width="2"/><text x="62" y="298" fill="#e8e6f5">Cara</text><rect x="140" y="280" width="100" height="24" rx="6" fill="#171233"/><text x="150" y="297" fill="#9d98c4" font-size="12" font-weight="400">draft…</text></g>
    <g><rect x="350" y="140" width="220" height="48" rx="12" fill="#2b2257" stroke="#c084fc" stroke-width="2"/><text x="372" y="170" fill="#e8e6f5">Bob</text><rect x="450" y="152" width="100" height="24" rx="6" fill="#171233"/><text x="460" y="169" fill="#9d98c4" font-size="12" font-weight="400">draft…</text></g>
    <g><rect x="350" y="204" width="220" height="48" rx="12" fill="#2b2257" stroke="#fbbf24" stroke-width="2"/><text x="372" y="234" fill="#e8e6f5">Cara</text><rect x="450" y="216" width="100" height="24" rx="6" fill="#171233"/><text x="460" y="233" fill="#9d98c4" font-size="12" font-weight="400">draft…</text></g>
  </g>
  <path d="M280 228H330" stroke="#9d98c4" stroke-width="2" marker-end="url(#a)"/>
  <text x="305" y="216" fill="#9d98c4" font-size="12" text-anchor="middle">delete Alice</text>
</svg>
